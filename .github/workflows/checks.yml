name: Host checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q build.py bootstrap.py dependencies.py settings.py run_console.py tools web/server.py tests
      - name: Verify evidence and reject invalid captures
        run: python -m unittest discover -s tests -v
